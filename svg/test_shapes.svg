<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500">
<!-- Línea visible de referencia -->
<line x1="50" y1="50" x2="450" y2="50" stroke="gray" stroke-width="4" />

<!-- Primer rectángulo verde con borde negro -->
